# Local-first read with the in-app Force Offline Mode (simulated; use on iOS, where the sim shares the Mac's network).
# Precondition: `biel-verify flow download-book` passed. Do NOT relaunch after toggling: the switch is in-memory only.
appId: ${APP_ID}
---
- runFlow: _home.yaml
- tapOn: "Menu"
- tapOn: "System Settings"
- tapOn: "Force Offline Mode"
- waitForAnimationToEnd   # a tap during the drawer/toggle animation is lost
- tapOn:   # the drawer's ✕; the full-screen backdrop shares the label "Close menu" and taps on it are lost on CI
    text: "Close menu"
    rightOf: "System Settings"
- extendedWaitUntil:
    notVisible: "Force Offline Mode"
    timeout: 10000
- extendedWaitUntil:
    visible: "You are in offline mode."
    timeout: 10000
- takeScreenshot: 01-home-forced-offline
- tapOn:                 # the toast hides itself after 6 s, so it may already be gone
    text: "Dismiss"
    optional: true
- tapOn: "Search language here..."
- inputText: "en"
- tapOn: "Open English"
- extendedWaitUntil:
    visible: "Old Testament"
    timeout: 30000
- tapOn: "Search book here..."   # search opens both testament groups
- inputText: "2 John"
- tapOn: "Expand 2 John"
- extendedWaitUntil:
    visible: "Chapter 1.*"
    timeout: 30000
- tapOn: "Chapter 1.*"
- extendedWaitUntil:
    visible: ".*From the elder to the chosen lady.*"
    timeout: 30000
- takeScreenshot: 02-2john-read-forced-offline
- tapOn:                 # the toast reappears if the connection flaps; it sits at the bottom, clear of the back arrow
    text: "Dismiss"
    optional: true
- tapOn: "Go back"
- tapOn: "Clear search"
- tapOn: "Search book here..."
- inputText: "3 John"
- tapOn: "Expand 3 John"
- waitForAnimationToEnd
- assertNotVisible: "Chapter 1.*"
- takeScreenshot: 03-3john-not-downloaded
