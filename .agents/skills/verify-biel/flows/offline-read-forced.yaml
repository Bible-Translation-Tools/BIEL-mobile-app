# Local-first read with the in-app Force Offline Mode (simulated; use on iOS, where the sim shares the Mac's network).
# Precondition: `biel-verify flow download-book` passed. Do NOT relaunch after toggling: the switch is in-memory only.
appId: ${APP_ID}
---
- runFlow: _home.yaml
- tapOn: "Menu"
- tapOn: "System Settings"
- tapOn: "Force Offline Mode"
- waitForAnimationToEnd   # a backdrop tap during the drawer/toggle animation is lost
- tapOn:   # dimmed backdrop left of the drawer
    point: "10%,50%"
- extendedWaitUntil:
    visible: "You are in offline mode."
    timeout: 10000
- takeScreenshot: 01-home-forced-offline
- tapOn: "Dismiss"
- tapOn: "Search language here..."
- inputText: "en"
- tapOn: "Open English"
- extendedWaitUntil:
    visible: "New Testament"
    timeout: 30000
- tapOn: "New Testament"
- tapOn: "Search book here..."
- inputText: "2 John"
- tapOn: "Expand 2 John"
- extendedWaitUntil:
    visible: "Chapter 1.*"
    timeout: 30000
- tapOn: "Chapter 1.*"
- extendedWaitUntil:
    visible: ".*From the elder to the chosen lady.*"
    timeout: 30000
- takeScreenshot: 02-2john-read-forced-offline
- tapOn:                 # the banner sometimes reappears after being dismissed and covers the back arrow
    text: "Dismiss"
    optional: true
- tapOn: "Go back"
- tapOn: "Clear search"
- tapOn: "Search book here..."
- inputText: "3 John"
- tapOn: "Expand 3 John"
- waitForAnimationToEnd
- assertNotVisible: "Chapter 1.*"
- takeScreenshot: 03-3john-not-downloaded
