# Wait until the app has booted past splash (DB, i18n, catalog) and shows Home.
# "Open" confirms iOS's "Open in BIEL?" prompt for the dev-client deep link (simctl openurl).
# "Allow"/"Continue" are fallbacks; biel-verify normally prevents those prompts.
appId: ${APP_ID}
---
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# Launch reopens the last book list or chapter (reading checkpoint, docs/reading-checkpoint.md), with its
# parent screens pushed under it. Back out of them (reader → books/Downloads Library → Home); leaving
# each screen clears its checkpoint. Home stays blank while it restores, so first wait for either.
- extendedWaitUntil:
    visible: "Browse the Bible|Go back"
    timeout: 120000
- repeat:
    while:
      visible: "Go back"
    times: 4
    commands:
      - tapOn: "Go back"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "Browse the Bible|Go back"
          timeout: 30000
- extendedWaitUntil:
    visible: "Browse the Bible"
    timeout: 30000
