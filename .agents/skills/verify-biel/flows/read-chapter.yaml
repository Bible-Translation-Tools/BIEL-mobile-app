# Reader: chapter text renders; Text Settings change size and reset; back returns to books.
appId: ${APP_ID}
---
- runFlow: _open-2john.yaml
- tapOn: "Chapter 1.*"
- extendedWaitUntil:
    visible: ".*From the elder to the chosen lady.*"
    timeout: 30000
- assertVisible: "2 John 1"
- takeScreenshot: 01-reader-default
- tapOn: "Menu"
- tapOn: "Text Settings"
- assertVisible: "Text Size"
- assertVisible: "Line Height"
- tapOn: "Increase text size"
- tapOn: "Increase text size"
- tapOn: "Increase line height"
- takeScreenshot: 02-text-settings-bigger
- waitForAnimationToEnd   # a tap during the drawer/toggle animation is lost
- tapOn:   # the drawer's ✕; the full-screen backdrop shares the label "Close menu" and taps on it are lost on CI
    text: "Close menu"
    rightOf: "Text Settings"
- extendedWaitUntil:
    notVisible: "Text Size"
    timeout: 10000
- takeScreenshot: 03-reader-bigger
- tapOn: "Menu"
- tapOn: "Text Settings"
- tapOn: "Reset text settings"
- waitForAnimationToEnd   # a tap during the drawer/toggle animation is lost
- tapOn:   # the drawer's ✕; the full-screen backdrop shares the label "Close menu" and taps on it are lost on CI
    text: "Close menu"
    rightOf: "Text Settings"
- extendedWaitUntil:
    notVisible: "Text Size"
    timeout: 10000
- takeScreenshot: 04-reader-reset
- tapOn: "Go back"
- assertVisible: "Collapse 2 John"
