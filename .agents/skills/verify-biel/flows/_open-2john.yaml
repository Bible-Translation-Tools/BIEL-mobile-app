# English → search 2 John → expanded (chapter grid visible). Stops before opening a chapter.
# No testament tap: a book search opens both groups, and the New Testament header sits below the
# open Old Testament list (off-screen on a phone).
appId: ${APP_ID}
---
- runFlow: _open-english.yaml
- tapOn: "Search book here..."
- inputText: "2 John"
- tapOn: "Expand 2 John"
- extendedWaitUntil:
    visible: "Chapter 1.*"
    timeout: 30000
