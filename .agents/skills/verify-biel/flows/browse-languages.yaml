# Home: language catalog loads, search narrows it, empty state, clear, open a language.
appId: ${APP_ID}
---
- runFlow: _home.yaml
- assertVisible: "Search language here..."
- takeScreenshot: 01-catalog
- tapOn: "Search language here..."
- inputText: "en"
- hideKeyboard
- assertVisible: "Open English"
- takeScreenshot: 02-search-en
- tapOn: "Clear search"
- tapOn: "Search language here..."
- inputText: "zzqx"
- hideKeyboard
- assertVisible: "No languages found"
- takeScreenshot: 03-empty
- tapOn: "Clear search"
- tapOn: "Search language here..."
- inputText: "en"
- hideKeyboard
- tapOn: "Open English"
- extendedWaitUntil:
    visible: "Old Testament"
    timeout: 30000
- assertVisible: "New Testament"
- takeScreenshot: 04-books-for-english
